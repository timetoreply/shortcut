version: 2

updates:
  # --- PHP dependencies (composer.json / composer.lock) ---
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "dependabot"
    commit-message:
      prefix: "deps"
    # Group all minor + patch updates into a single weekly PR
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Ignore all major updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]